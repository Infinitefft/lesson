<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>


  <script>
    function debounce(fn, delay) {
      // this 
      let timer = null;
      // 闭包
      return function(...args) {
        // this 箭头函数
        if (timer) {
          clearTimeout(timer);
        }
        timer = setTimeout(() => {
          fn.apply(this, args);
        }, delay);
      }
    }
  </script>
</body>
</html>
